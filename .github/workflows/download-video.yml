name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID"
        required: true
        type: string
      candidate_id:
        description: "Candidate document ID"
        required: true
        type: string
      gcs_bucket:
        description: "GCS bucket name for upload"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup proxy or cookies or extractor args
        env:
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_PROXY" ]; then
            PROXY_URL=$(python3 -c "
import sys, re
raw = '''$YOUTUBE_PROXY'''.strip()
lines = [l.strip() for l in raw.splitlines() if l.strip() and not l.strip().startswith('#')]
if lines:
    line = lines[0]
    if re.match(r'^(https?|socks5|socks4)://', line, re.I):
        print(line)
    else:
        parts = line.split(':')
        if len(parts) == 4:
            if '.' in parts[0]:
                ip, port, user, pwd = parts
            else:
                user, pwd, ip, port = parts
            print(f'http://{user}:{pwd}@{ip}:{port}')
        else:
            print(line)
")
            echo "YOUTUBE_PROXY_SINGLE=$PROXY_URL" >> $GITHUB_ENV
            echo "🌐 Using YOUTUBE_PROXY secret"
          elif [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            echo "USE_COOKIES=true" >> $GITHUB_ENV
            echo "✅ Using YOUTUBE_COOKIES secret"
          else
            echo "USE_ANDROID_FALLBACK=true" >> $GITHUB_ENV
            echo "⚠️ No proxy or cookies set, using android client fallback"
          fi

      - name: Download video
        run: |
          FLAGS=()
          if [ -n "$YOUTUBE_PROXY_SINGLE" ]; then
            FLAGS+=("--proxy" "$YOUTUBE_PROXY_SINGLE")
          elif [ "$USE_COOKIES" = "true" ]; then
            FLAGS+=("--cookies" "cookies.txt")
          elif [ "$USE_ANDROID_FALLBACK" = "true" ]; then
            FLAGS+=("--extractor-args" "youtube:player_client=android")
          fi

          yt-dlp \
            "${FLAGS[@]}" \
            -f "b[ext=mp4]/bv*[ext=mp4]+ba[ext=m4a]/b" \
            --no-playlist \
            --no-warnings \
            --merge-output-format mp4 \
            -o "video.mp4" \
            "https://www.youtube.com/watch?v=${{ inputs.video_id }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        run: |
          gcloud storage cp video.mp4 \
            "gs://${{ inputs.gcs_bucket }}/source/${{ inputs.candidate_id }}/${{ inputs.video_id }}.mp4"
          echo "✅ Uploaded to gs://${{ inputs.gcs_bucket }}/source/${{ inputs.candidate_id }}/${{ inputs.video_id }}.mp4"
