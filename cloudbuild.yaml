steps:
  # 1. shorts-api 빌드 및 푸시 (BuildKit 활성화)
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -f Dockerfile.api \
          --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shorts-api:${_IMAGE_TAG} \
          --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shorts-api:latest \
          . && \
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shorts-api:${_IMAGE_TAG} && \
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shorts-api:latest

  # 2. shorts-job 빌드 및 푸시 (BuildKit 활성화)
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -f Dockerfile.job \
          --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shorts-job:${_IMAGE_TAG} \
          --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shorts-job:latest \
          . && \
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shorts-job:${_IMAGE_TAG} && \
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shorts-job:latest

substitutions:
  _REGION: asia-northeast3
  _REPOSITORY: shorts
  _IMAGE_TAG: manual
