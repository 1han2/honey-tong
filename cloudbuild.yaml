steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - --file=Dockerfile.api
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shorts-api:${_IMAGE_TAG}
      - .
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - --file=Dockerfile.job
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shorts-job:${_IMAGE_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shorts-api:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/shorts-job:${_IMAGE_TAG}
substitutions:
  _REGION: asia-northeast3
  _REPOSITORY: shorts
  _IMAGE_TAG: manual
